name: Build ProvaFácil Android APK

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "tailwind.config.cjs"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK offline
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Instalar plataforma e ferramentas Android
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Preparar os arquivos offline
        run: npm run android:prepare

      - name: Criar projeto Android
        run: npx cap add android

      - name: Configurar permissões nativas
        run: npm run android:patch-manifest

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK de instalação
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ProvaFacil-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
